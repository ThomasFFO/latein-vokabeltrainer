<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><link rel="manifest" href="manifest.webmanifest"><title>Vokabelkasten</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f6f7f9;color:#1d1d1f;margin:0}.w{max-width:900px;margin:auto;padding:24px 14px}.card{background:white;padding:20px;border-radius:18px;margin:12px 0}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;padding:12px;border-radius:11px;border:1px solid #d2d2d7}button{border:0;background:#e9e9ed}.p{background:#0071e3;color:white}.tab.on{background:#0071e3;color:white}.pane{display:none}.pane.on{display:block}input,select{background:white;box-sizing:border-box}.full{width:100%}.q{text-align:center;font-size:40px;font-weight:700;margin:25px 0}.good{color:#16803b}.bad{color:#c62828}.muted{color:#6e6e73;font-size:13px}.word{padding:10px 0;border-bottom:1px solid #ddd}.sel{background:#eef6ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}.q{font-size:34px}}</style></head><body><div class="w"><h1>Vokabelkasten</h1>
<div class="tabs"><button class="tab on" data-p="learn">Lernen</button><button class="tab" data-p="words">Vokabeln</button><button class="tab" data-p="boxes">Kästen</button></div>
<div id="learn" class="pane on"><div class="card"><div class="grid"><select id="lb"></select><select id="dir"><option value="f">Fremdsprache → Deutsch</option><option value="r">Deutsch → Fremdsprache</option><option value="m">Gemischt</option></select></div><div id="q" class="q">–</div><div class="row"><input id="ans" style="flex:1" placeholder="Deine Antwort …"><button id="mic">🎤</button></div><div class="row" style="margin-top:10px"><button id="check" class="p">Antwort prüfen</button><button id="next">Nächste</button></div><h3 id="fb"></h3><div id="stats" class="muted"></div></div></div>
<div id="words" class="pane"><div class="card"><select id="wb" class="full"></select><div class="grid" style="margin-top:10px"><input id="foreign" placeholder="Fremdsprache"><input id="german" placeholder="Deutsch"></div><div class="row" style="margin-top:10px"><button id="add" class="p">Hinzufügen</button><button id="edit">Ändern</button><button id="del">Löschen</button></div><div id="list"></div></div></div>
<div id="boxes" class="pane"><div class="card"><h2>Vokabelkästen</h2><div class="row"><input id="bn" style="flex:1" placeholder="Name des neuen Kastens"><button id="new" class="p">Anlegen</button></div><div id="bl"></div><hr><h2>Sicherung</h2><div class="row"><button id="export">Alle Kästen exportieren</button><input id="import" type="file" accept=".json"></div><p class="muted">Beim Import kannst du den Lernstand übernehmen oder zurücksetzen.</p></div></div>
<script>
const K="vokabelkasten_v3",O="latein_vocab_trainer_v2";let S=load(),cur=null,prev=null,cd="f",done=false,sel=null;
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function P(){return{m:0,c:0,w:0,s:0}}function cv(v){return{id:v.id||uid(),a:v.foreign||v.latin||"",b:v.german||"",f:v.forward||{m:v.mastery||0,c:v.correct||0,w:v.wrong||0,s:v.streak||0},r:v.reverse||P()}}
function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x?.boxes)return x;let o=JSON.parse(localStorage.getItem(O));if(o?.vocabs)return{boxes:[{id:uid(),name:"Latein",words:o.vocabs.map(cv)}]}}catch(e){}return{boxes:[{id:uid(),name:"Mein Vokabelkasten",words:[]}]}}
S.active=S.boxes.some(x=>x.id===S.active)?S.active:S.boxes[0].id;save();function save(){localStorage.setItem(K,JSON.stringify(S))}function B(){return S.boxes.find(x=>x.id===S.active)}function n(x){return(x||"").trim().toLowerCase().replace(/\s+/g," ")}function ok(x,y){return y.split(";").map(n).includes(n(x))}
function sync(){for(let id of["lb","wb"]){let e=document.getElementById(id);e.innerHTML=S.boxes.map(b=>`<option value="${b.id}">${b.name}</option>`).join("");e.value=S.active}render();boxes()}
function choose(){let w=B().words;if(!w.length)return null;let a=w.length>1?w.filter(x=>x.id!==prev):w,v=a[Math.floor(Math.random()*a.length)],d=dir.value==="m"?(Math.random()<.5?"f":"r"):dir.value;let weights=a.map(x=>{let p=x[d];return 1+(8-p.m)**2+p.w*2});let t=weights.reduce((a,b)=>a+b),z=Math.random()*t;for(let i=0;i<a.length;i++){z-=weights[i];if(z<=0){v=a[i];break}}return{v,d}}
function next(){let x=choose();fb.textContent="";done=false;ans.value="";if(!x){q.textContent="Noch keine Vokabeln";cur=null;return}cur=x.v.id;prev=cur;cd=x.d;q.textContent=cd==="f"?x.v.a:x.v.b}
function check(){if(!cur||done||!ans.value.trim())return;let v=B().words.find(x=>x.id===cur),exp=cd==="f"?v.b:v.a,p=v[cd];if(ok(ans.value,exp)){p.m=Math.min(8,p.m+(p.s>=2?2:1));p.s++;p.c++;fb.textContent="✓ Richtig!";fb.className="good"}else{p.m=Math.max(0,p.m-2);p.s=0;p.w++;fb.textContent="✗ Richtig wäre: "+exp;fb.className="bad"}done=true;save();render()}
function render(){list.innerHTML=B().words.map(v=>`<div class="word ${sel===v.id?"sel":""}" data-id="${v.id}"><b>${v.a}</b> – ${v.b}<div class="muted">→ Stufe ${v.f.m} · ← Stufe ${v.r.m}</div></div>`).join("");list.querySelectorAll("[data-id]").forEach(e=>e.onclick=()=>{sel=e.dataset.id;let v=B().words.find(x=>x.id===sel);foreign.value=v.a;german.value=v.b;render()});let c=B().words.reduce((s,v)=>s+v.f.c+v.r.c,0),w=B().words.reduce((s,v)=>s+v.f.w+v.r.w,0);stats.textContent=`${B().words.length} Vokabeln · ${c} richtig · ${w} falsch`}
function boxes(){bl.innerHTML=S.boxes.map(b=>`<div class="word"><button data-open="${b.id}">${b.name} (${b.words.length})${b.id===S.active?" ✓":""}</button> <button data-ren="${b.id}">Umbenennen</button> <button data-del="${b.id}">Löschen</button></div>`).join("");bl.querySelectorAll("[data-open]").forEach(e=>e.onclick=()=>setB(e.dataset.open));bl.querySelectorAll("[data-ren]").forEach(e=>e.onclick=()=>{let b=S.boxes.find(x=>x.id===e.dataset.ren),z=prompt("Neuer Name",b.name);if(z?.trim()){b.name=z.trim();save();sync()}});bl.querySelectorAll("[data-del]").forEach(e=>e.onclick=()=>{if(S.boxes.length===1)return alert("Ein Kasten muss erhalten bleiben.");if(confirm("Diesen Kasten samt Vokabeln löschen?")){S.boxes=S.boxes.filter(x=>x.id!==e.dataset.del);if(!S.boxes.some(x=>x.id===S.active))S.active=S.boxes[0].id;save();sync();next()}})}
function setB(x){S.active=x;sel=cur=prev=null;save();sync();next()}lb.onchange=e=>setB(e.target.value);wb.onchange=e=>setB(e.target.value);dir.onchange=next;next.onclick=next;check.onclick=check;ans.onkeydown=e=>{if(e.key==="Enter")(done?next():check())};
add.onclick=()=>{if(!foreign.value.trim()||!german.value.trim())return;B().words.push({id:uid(),a:foreign.value.trim(),b:german.value.trim(),f:P(),r:P()});foreign.value=german.value="";save();render();if(!cur)next()};
edit.onclick=()=>{let v=B().words.find(x=>x.id===sel);if(v){v.a=foreign.value.trim();v.b=german.value.trim();save();render()}};del.onclick=()=>{if(sel&&confirm("Vokabel löschen?")){B().words=B().words.filter(x=>x.id!==sel);sel=cur=null;save();render();next()}};
new.onclick=()=>{if(!bn.value.trim())return;let b={id:uid(),name:bn.value.trim(),words:[]};S.boxes.push(b);bn.value="";save();setB(b.id)};
mic.onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){alert("Direkte Browser-Spracherkennung ist hier nicht verfügbar. Nutze das Mikrofon der iPhone-Tastatur.");ans.focus();return}let r=new R();r.lang=cd==="f"?"de-DE":"de-DE";r.onresult=e=>ans.value=e.results[0][0].transcript;r.start()};
export.onclick=()=>{let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({app:"Vokabelkasten",version:3,boxes:S.boxes},null,2)],{type:"application/json"}));a.href=u;a.download="vokabelkasten.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};
import.onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!x.boxes)throw 0;let keep=confirm("Lernstand übernehmen?\nOK = ja, Abbrechen = Lernstand zurücksetzen");let bs=x.boxes.map(b=>({id:uid(),name:b.name||"Import",words:(b.words||[]).map(cv).map(v=>{v.id=uid();if(!keep){v.f=P();v.r=P()}return v})}));S.boxes.push(...bs);save();setB(bs[0].id)}catch(z){alert("Import nicht möglich.")}};
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab,.pane").forEach(x=>x.classList.remove("on"));t.classList.add("on");document.getElementById(t.dataset.p).classList.add("on")});
if("serviceWorker"in navigator)navigator.serviceWorker.register("./service-worker.js").catch(()=>{});sync();next();
</script></div></body></html>
